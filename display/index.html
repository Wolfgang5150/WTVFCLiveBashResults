<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WTVFC Live Bash Digital Display</title>
<style>
:root{color-scheme:dark;--gold:#e6c477;--bright:#f5d98e;--muted:#a9956b;--line:#3b301a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--gold);font-family:Arial,Helvetica,sans-serif;cursor:none}body{display:flex;flex-direction:column;padding:2.3vh 2.5vw 2.1vh}header{text-align:center;flex:none}h1{font-size:clamp(20px,3.05vw,66px);line-height:1.12;margin:0 0 1.2vh;font-weight:700;letter-spacing:-.025em;overflow-wrap:anywhere}#message{font-size:1.65vw;line-height:1.2;margin:0 0 1.5vh;color:var(--gold)}#section{font-size:1.35vw;letter-spacing:.16em;text-transform:uppercase;margin:0 0 1.3vh;color:var(--bright);font-weight:700}#labels,#columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2vw}#labels{flex:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:1.15vh 0;color:var(--muted);font-size:1.2vw;text-transform:uppercase;letter-spacing:.06em}.main-label,.main-row{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:.5vw}.main-label span:last-child,.main-row .winner{text-align:right}#viewport{flex:1;min-height:0;overflow:hidden;position:relative}#columns{align-items:start;will-change:transform}.column{min-width:0}.main-row{height:8.2vh;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}.time{font-size:2.5vw;letter-spacing:-.035em}.winner{font-size:3.25vw;font-weight:700;letter-spacing:-.025em;color:var(--bright)}.pending{font-size:1.85vw;color:var(--muted);font-weight:400}.other-label{display:flex;justify-content:space-between;gap:1vw}.other-row{min-height:15vh;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.6vw;padding:1.2vh 0}.other-copy{min-width:0;display:flex;flex-direction:column;gap:.45vh}.other-type{font-size:1.55vw;font-weight:700;overflow-wrap:anywhere}.other-prize{font-size:1.48vw;overflow-wrap:anywhere;color:var(--bright)}.other-meta{font-size:1.12vw;overflow-wrap:anywhere;color:var(--muted)}.other-row .winner{font-size:2.55vw;max-width:11vw;overflow-wrap:anywhere;text-align:right}.empty{grid-column:1/-1;text-align:center;padding:15vh 1vw;font-size:2.4vw;color:var(--muted)}footer{display:flex;justify-content:space-between;align-items:center;flex:none;font-size: .85vw;color:var(--muted);padding-top:1vh}#status{min-height:1em}#version{margin-left:auto}#viewport[aria-busy=true]{opacity:.9}
</style></head><body><header><h1 id="eventTitle">Live Bash Results</h1><p id="message">Claim all main ticket prizes at the front window.</p><h2 id="section">Main Ticket Results</h2></header><div id="labels"></div><main id="viewport"><div id="columns"></div></main><footer><span id="status" role="status">Connecting to event results…</span><span id="version">v1.0</span></footer>
<script>
'use strict';
const VERSION='1.0',ENDPOINT='https://script.google.com/macros/s/AKfycbyk2Pj807Lvuggb9SwbPwO_lRnuSKh8vd5GqXphr9iN4yVujtrINJYxU8n74VHTQ-TdlA/exec';
const TOP_HOLD=5000,BOTTOM_HOLD=10000,SCROLL_SPEED=22,REFRESH=10000;
const $=id=>document.getElementById(id), make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
let current=null,mode='main',signature='',phase='top',phaseStart=0,offset=0,maxOffset=0,raf=0,failures=0,versionBusy=false;
const str=v=>String(v??'').trim();
function splitRows(rows){const q=Math.floor(rows.length/3),r=rows.length%3;const sizes=[q+(r>0?1:0),q+(r>1?1:0),q];let pos=0;return sizes.map(n=>{const chunk=rows.slice(pos,pos+n);pos+=n;return chunk})}
function normalize(p){if(!p||p.error||!Object.prototype.hasOwnProperty.call(p,'event'))throw Error('Invalid response');if(p.event===null)return null;const e=p.event;if(!e.meta||!Array.isArray(e.main)||!Array.isArray(e.other))throw Error('Invalid event');return {meta:e.meta,main:e.main.filter(Array.isArray).map(r=>({time:str(r[0]),number:str(r[1])})),other:e.other.filter(Array.isArray).map(r=>({time:str(r[0]),type:str(r[1]),serial:str(r[2]),number:str(r[3]),prize:str(r[4]),color:str(r[5]),name:str(r[6])}))}}
function drawRow(r){const n=make('div','main-row');n.append(make('span','time',r.time),make('span','winner'+(r.number?'':' pending'),r.number||'Pending'));return n}
function otherRow(r){const n=make('div','other-row'),c=make('div','other-copy');c.append(make('span','other-type',[r.type,r.name].filter(Boolean).join(' — ')),make('span','other-prize',r.prize),make('span','other-meta',[r.time,r.serial?'Serial # '+r.serial:'',r.color?r.color+' ticket':''].filter(Boolean).join(' · ')));n.append(c,make('span','winner',r.number));return n}
function measure(){maxOffset=Math.max(0,$('columns').scrollHeight-$('viewport').clientHeight);offset=Math.min(offset,maxOffset);$('columns').style.transform=`translateY(${-offset}px)`}
function render(reset=false){const e=current,m=e?.meta||{};const title=[(str(m['Event name'])||'')+' Live Results',str(m.Date)].filter(Boolean).join(' — ').trim();$('eventTitle').textContent=e?title:'Live Bash Results';$('message').textContent=mode==='main'?'Claim all main ticket prizes at the front window.':'';$('message').style.visibility=mode==='main'?'visible':'hidden';$('section').textContent=mode==='main'?'Main Ticket Results':'Other Game Results';const rows=e?e[mode]:[];const sig=JSON.stringify([mode,rows,!!e]);if(sig!==signature){signature=sig;const labels=Array.from({length:3},()=>{const l=make('div',mode==='main'?'main-label':'other-label');l.append(make('span','',mode==='main'?'Drawing Time':'Game / Prize'),make('span','','Winning Number'));return l});$('labels').replaceChildren(...labels);$('columns').replaceChildren(...(rows.length?splitRows(rows).map(chunk=>{const c=make('div','column');c.append(...chunk.map(mode==='main'?drawRow:otherRow));return c}):[make('div','empty',!e?'No event currently available.':mode==='main'?'No main ticket drawings available.':'No other game results yet.')]));}if(reset){offset=0;phase='top';phaseStart=performance.now()}measure();}
function tick(now){const elapsed=Math.max(0,now-phaseStart);if(phase==='top'&&elapsed>=TOP_HOLD){phase=maxOffset>0?'scroll':'bottom';phaseStart=now;offset=0;}else if(phase==='scroll'){offset=Math.min(maxOffset,elapsed*SCROLL_SPEED/1000*window.innerHeight/1080);if(offset>=maxOffset){phase='bottom';phaseStart=now;}}else if(phase==='bottom'&&elapsed>=BOTTOM_HOLD){mode=mode==='main'?'other':'main';render(true);} $('columns').style.transform=`translateY(${-offset}px)`;raf=requestAnimationFrame(tick)}
async function fetchJSON(url){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const res=await fetch(url,{cache:'no-store',credentials:'omit',signal:controller.signal});if(!res.ok)throw Error('HTTP '+res.status);return await res.json()}finally{clearTimeout(timer)}}
async function refresh(){try{const next=normalize(await fetchJSON(ENDPOINT));const changedEvent=(current?.meta?.['Event ID']||'')!==(next?.meta?.['Event ID']||'');current=next;failures=0;$('status').textContent='';if(changedEvent){mode='main';render(true)}else render();}catch(e){failures++;$('status').textContent=current?'Connection interrupted — displaying last received results':'Waiting for event results — retrying';}finally{setTimeout(refresh,failures?Math.min(60000,10000*2**Math.min(failures-1,3))+Math.random()*2000:REFRESH)}}
async function checkVersion(){if(versionBusy)return;versionBusy=true;try{const v=await fetchJSON(new URL('version.json',location.href));if(/^\d+(\.\d+)+$/.test(v.version)&&v.version!==VERSION){const u=new URL(location.href);const last=Number(u.searchParams.get('_releaseTime'))||0;if(Date.now()-last>120000){u.searchParams.set('_releaseTime',Date.now());location.replace(u.href)}}}catch(e){}finally{versionBusy=false}}
window.addEventListener('resize',measure);render(true);raf=requestAnimationFrame(tick);refresh();setInterval(checkVersion,120000);
</script></body></html>
