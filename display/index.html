<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WTVFC Live Bash Digital Display</title>
<style>
:root{color-scheme:dark;--gold:#e6c477;--bright:#f5d98e;--muted:#a9956b;--line:#3b301a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--gold);font-family:Arial,Helvetica,sans-serif;cursor:none}body{display:flex;flex-direction:column;padding:2.3vh 2.5vw 2.1vh}header{text-align:center;flex:none}h1{font-size:clamp(20px,3.05vw,66px);line-height:1.12;margin:0 0 1.2vh;font-weight:700;letter-spacing:-.025em;overflow-wrap:anywhere}#message{font-size:2.475vw;line-height:1.2;margin:0 0 1.5vh;color:var(--gold)}#section{font-size:2.025vw;letter-spacing:.16em;text-transform:uppercase;margin:0 0 1.3vh;color:#000;background:var(--gold);font-weight:700;padding:.65vh 1vw;line-height:1.2;width:100%}#labels,#columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3vw}#labels{flex:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:1.15vh 0;color:var(--muted);font-size:1.2vw;text-transform:uppercase;letter-spacing:.06em}.main-label,.main-row{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:.5vw}.main-label span:last-child,.main-row .winner{text-align:right}#viewport{flex:1;min-height:0;overflow:hidden;position:relative}#columns{align-items:start;will-change:transform}.column{min-width:0}.main-row{height:12.3vh;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}.time{font-size:3.75vw;letter-spacing:-.035em}.winner{font-size:4.875vw;font-weight:700;letter-spacing:-.025em;color:var(--bright)}.pending{font-size:2.775vw;color:var(--muted);font-weight:400}.other-label{display:flex;justify-content:center;align-items:center;gap:1vw}.other-label span{font-size:1.2vw}.other-label span:last-child{display:none}.other-row{min-height:24.8vh;border-bottom:1px solid var(--line);padding:1.25vh 0 1.5vh;display:flex;flex-direction:column;gap:1.05vh}.other-top{display:flex;justify-content:space-between;align-items:flex-end;gap:1vw;color:var(--muted);font-size:1.38vw;text-transform:uppercase;letter-spacing:.05em}.other-type,.other-drawn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.other-prize-wrap{display:flex;flex-direction:column;gap:.25vh}.other-prize{font-size:2.36vw;line-height:1.08;font-weight:700;color:var(--bright);overflow-wrap:anywhere}.other-subprize{font-size:1.28vw;line-height:1.15;color:var(--gold);overflow-wrap:anywhere}.other-bottom{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);gap:1.1vw;align-items:end;padding-top:.4vh}.other-divider{align-self:stretch;background:var(--line)}.other-cell{min-width:0;display:flex;flex-direction:column;gap:.35vh}.other-cell:last-child{text-align:right}.other-cell .other-caption{font-size:1.55vw;line-height:1;text-transform:uppercase;letter-spacing:.04em;color:var(--gold)}.other-cell .other-big{font-size:4.45vw;line-height:.95;font-weight:700;letter-spacing:-.04em;color:var(--bright);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.other-cell:last-child .other-big{color:#fff}.other-cell .other-big.pending{font-size:2.6vw;color:var(--muted);font-weight:400;letter-spacing:0}.empty{grid-column:1/-1;text-align:center;padding:15vh 1vw;font-size:3.6vw;color:var(--muted)}footer{display:flex;justify-content:space-between;align-items:center;flex:none;font-size: 1.275vw;color:var(--muted);padding-top:1vh}#status{min-height:1em}#version{margin-left:auto}#viewport[aria-busy=true]{opacity:.9}

/* Fixed separators centered in the enlarged gutters. */
#labels{position:relative}#labels::before,#labels::after,#viewport::before,#viewport::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--gold);opacity:.85;pointer-events:none;z-index:2;transform:translateX(-50%)}#labels::before,#viewport::before{left:calc(33.333333% - .5vw)}#labels::after,#viewport::after{left:calc(66.666667% + .5vw)}

/* Compact other-game entries: fit text to its assigned width without losing characters. */
.other-row{min-height:19vh;padding:.9vh 0 1.1vh;gap:.65vh}.other-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:.5vw;align-items:center;font-size:1.08vw}.other-type,.other-drawn{display:block;min-width:0;white-space:nowrap;overflow:visible;text-overflow:clip}.other-drawn{text-align:right}.other-prize{font-size:1.85vw;line-height:1.12;min-width:0;overflow-wrap:anywhere}.other-subprize{font-size:1.15vw;line-height:1.12;min-width:0;overflow-wrap:anywhere}.other-bottom{gap:.65vw;align-items:start;padding-top:.2vh}.other-cell .other-caption{font-size:1.15vw;white-space:nowrap}.other-cell .other-big{display:block;min-width:0;font-size:2.65vw;line-height:1.12;white-space:nowrap;overflow-wrap:normal;word-break:normal;letter-spacing:-.035em}.other-cell .other-big.pending{font-size:1.7vw}.other-cell{gap:.25vh}.other-divider{background:var(--line)}

/* v1.8: results contrast, entry separation and unobtrusive version marker. */
.main-row .winner:not(.pending){color:#fff}
.other-cell .other-caption{color:var(--muted)}
.other-row{padding:2.025vh 0 2.475vh;min-height:21.5vh}
.other-cell .other-big:not(.pending){color:#fff}
.other-bottom.no-serial{grid-template-columns:minmax(0,1fr)}
#version{position:fixed;top:.55vh;right:.7vw;font-family:Helvetica,Arial,sans-serif;font-size:1.275vw;font-weight:300;color:var(--muted);opacity:.5;line-height:1;pointer-events:none;z-index:5;margin:0}
</style></head><body><header><span id="version">v1.8</span><h1 id="eventTitle">Live Bash Results</h1><p id="message">Claim all main ticket prizes at the front window.</p><h2 id="section">Main Ticket Results</h2></header><div id="labels"></div><main id="viewport"><div id="columns"></div></main><footer><span id="status" role="status">Connecting to event results…</span></footer>
<script>
'use strict';
const pullTabLabel=v=>String(v??'').replace(/\bstrip tickets?\b/gi,'Pull-Tabs');
const VERSION='1.8',ENDPOINT='https://script.google.com/macros/s/AKfycbyk2Pj807Lvuggb9SwbPwO_lRnuSKh8vd5GqXphr9iN4yVujtrINJYxU8n74VHTQ-TdlA/exec';
const TOP_HOLD=5000,BOTTOM_HOLD=10000,SCROLL_SPEED=22,REFRESH=10000;
const $=id=>document.getElementById(id), make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
let hasLoaded=false,current=null,mode='main',signature='',phase='top',phaseStart=0,offset=0,maxOffset=0,raf=0,failures=0,versionBusy=false;
const str=v=>String(v??'').trim();
function splitRows(rows){const q=Math.floor(rows.length/3),r=rows.length%3;const sizes=[q+(r>0?1:0),q+(r>1?1:0),q];let pos=0;return sizes.map(n=>{const chunk=rows.slice(pos,pos+n);pos+=n;return chunk})}
function normalize(p){if(!p||p.error||!Object.prototype.hasOwnProperty.call(p,'event'))throw Error('Invalid response');if(p.event===null)return null;const e=p.event;if(!e.meta||!Array.isArray(e.main)||!Array.isArray(e.other))throw Error('Invalid event');return {meta:e.meta,main:e.main.filter(Array.isArray).map(r=>({time:str(r[0]),number:str(r[1])})),other:e.other.filter(Array.isArray).map(r=>({time:str(r[0]),type:pullTabLabel(str(r[1])),serial:str(r[2]),number:str(r[3]),prize:str(r[4]),color:str(r[5]),name:str(r[6])}))}}
function drawRow(r){const n=make('div','main-row');n.append(make('span','time',r.time),make('span','winner'+(r.number?'':' pending'),r.number||'Pending'));return n}
function otherRow(r){const n=make('div','other-row');const top=make('div','other-top');const typeBits=[r.type,r.color?r.color+' ticket':''].filter(Boolean);top.append(make('span','other-type',typeBits.join(' · ')),make('span','other-drawn',r.time?'Drawn at '+r.time:''));const wrap=make('div','other-prize-wrap');const primary=r.name||r.prize||'Result';wrap.append(make('div','other-prize',primary));if(r.name&&r.prize&&r.prize!==r.name)wrap.append(make('div','other-subprize',r.prize));const bottom=make('div','other-bottom');const left=make('div','other-cell');left.append(make('span','other-caption','Serial #'),make('span','other-big',r.serial||'—'));const divider=make('div','other-divider');const right=make('div','other-cell');right.append(make('span','other-caption','Winning #'),make('span','other-big'+(r.number?'':' pending'),r.number||'Pending'));if(r.type.toLowerCase()==='raffle'&&!r.serial){bottom.classList.add('no-serial');bottom.append(right)}else bottom.append(left,divider,right);n.append(top,wrap,bottom);return n}
function fitOtherText(){if(mode!=='other')return;const root=$('columns');for(const el of root.querySelectorAll('.other-type,.other-drawn,.other-caption,.other-big,.other-prize,.other-subprize')){el.style.fontSize='';el.style.whiteSpace='nowrap';const base=parseFloat(getComputedStyle(el).fontSize);if(!base||!el.clientWidth)continue;let size=base;const shrink=(fits,floor)=>{while(!fits()&&size>floor){size=Math.max(floor,size*.94);el.style.fontSize=size+'px'}};const fitsWidth=()=>el.scrollWidth<=el.clientWidth+1;const isPrize=el.classList.contains('other-prize')||el.classList.contains('other-subprize');if(isPrize){shrink(fitsWidth,base*.78);if(!fitsWidth()){el.style.whiteSpace='normal';const fitsTwo=()=>{const line=parseFloat(getComputedStyle(el).lineHeight);return el.scrollHeight<=line*2+1&&fitsWidth()};shrink(fitsTwo,1);}}else{shrink(fitsWidth,1);}}}
function measure(){maxOffset=Math.max(0,$('columns').scrollHeight-$('viewport').clientHeight);offset=Math.min(offset,maxOffset);$('columns').style.transform=`translateY(${-offset}px)`}
function render(reset=false){const e=current,m=e?.meta||{};const title=[(str(m['Event name'])||'')+' Live Results',str(m.Date)].filter(Boolean).join(' — ').trim();$('eventTitle').textContent=e?title:'Live Bash Results';$('message').textContent=mode==='main'?'Claim all main ticket prizes at the front window.':'';$('message').style.visibility=mode==='main'?'visible':'hidden';$('section').textContent=mode==='main'?'Main Ticket Results':'Other Game Results';const rows=e?e[mode]:[];const sig=JSON.stringify([mode,rows,!!e,hasLoaded]);if(sig!==signature){signature=sig;const labels=Array.from({length:3},()=>{const l=make('div',mode==='main'?'main-label':'other-label');l.append(make('span','',mode==='main'?'Drawing Time':'Other Game Result'),make('span','','Winning Number'));return l});$('labels').replaceChildren(...labels);$('columns').replaceChildren(...(rows.length?splitRows(rows).map(chunk=>{const c=make('div','column');c.append(...chunk.map(mode==='main'?drawRow:otherRow));return c}):[make('div','empty',!e?(hasLoaded?'No event currently available.':'Loading event results…'):mode==='main'?'No main ticket drawings available.':'No other game results yet.')]));fitOtherText();}if(reset){offset=0;phase='top';phaseStart=performance.now()}measure();}
function tick(now){const elapsed=Math.max(0,now-phaseStart);if(phase==='top'&&elapsed>=TOP_HOLD){phase=maxOffset>0?'scroll':'bottom';phaseStart=now;offset=0;}else if(phase==='scroll'){offset=Math.min(maxOffset,elapsed*SCROLL_SPEED/1000*window.innerHeight/1080);if(offset>=maxOffset){phase='bottom';phaseStart=now;}}else if(phase==='bottom'&&elapsed>=BOTTOM_HOLD){mode=mode==='main'?'other':'main';render(true);} $('columns').style.transform=`translateY(${-offset}px)`;raf=requestAnimationFrame(tick)}
async function fetchJSON(url){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const res=await fetch(url,{cache:'no-store',credentials:'omit',signal:controller.signal});if(!res.ok)throw Error('HTTP '+res.status);return await res.json()}finally{clearTimeout(timer)}}
async function refresh(){try{const next=normalize(await fetchJSON(ENDPOINT));const changedEvent=(current?.meta?.['Event ID']||'')!==(next?.meta?.['Event ID']||'');current=next;hasLoaded=true;failures=0;$('status').textContent='';if(changedEvent){mode='main';render(true)}else render();}catch(e){failures++;$('status').textContent=current?'Connection interrupted — displaying last received results':'Waiting for event results — retrying';}finally{setTimeout(refresh,failures?Math.min(60000,10000*2**Math.min(failures-1,3))+Math.random()*2000:REFRESH)}}
async function checkVersion(){if(versionBusy)return;versionBusy=true;try{const v=await fetchJSON(new URL('version.json',location.href));if(/^\d+(\.\d+)+$/.test(v.version)&&v.version!==VERSION){const u=new URL(location.href);const last=Number(u.searchParams.get('_releaseTime'))||0;if(Date.now()-last>120000){u.searchParams.set('_releaseTime',Date.now());location.replace(u.href)}}}catch(e){}finally{versionBusy=false}}
window.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.repeat)return;e.preventDefault();mode=mode==='main'?'other':'main';render(true)});
window.addEventListener('resize',()=>{fitOtherText();measure()});render(true);raf=requestAnimationFrame(tick);refresh();setInterval(checkVersion,120000);
</script></body></html>
