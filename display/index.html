<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WTVFC Live Bash Digital Display</title>
<style>
:root{color-scheme:dark;--gold:#e6c477;--bright:#f5d98e;--muted:#a9956b;--line:#3b301a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--gold);font-family:Arial,Helvetica,sans-serif;cursor:none}body{display:flex;flex-direction:column;padding:2.3vh 2.5vw 2.1vh}header{text-align:center;flex:none}h1{font-size:clamp(30px,4.575vw,99px);line-height:1.12;margin:0 0 1.2vh;font-weight:700;letter-spacing:-.025em;overflow-wrap:anywhere}#message{font-size:2.475vw;line-height:1.2;margin:0 0 1.5vh;color:var(--gold)}#section{font-size:3.0375vw;letter-spacing:.16em;text-transform:uppercase;margin:0 0 1.3vh;color:#000;background:var(--gold);font-weight:700;padding:.65vh 1vw;line-height:1.2;width:100%}#labels,#columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3vw}#labels{flex:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:1.15vh 0;color:var(--muted);font-size:1.2vw;text-transform:uppercase;letter-spacing:.06em}.main-label,.main-row{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:.5vw}.main-label span:last-child,.main-row .winner{text-align:right}#viewport{flex:1;min-height:0;overflow:hidden;position:relative}#columns{align-items:start;will-change:transform}.column{min-width:0}.main-row{height:12.3vh;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}.time{font-size:3.75vw;letter-spacing:-.035em}.winner{font-size:4.875vw;font-weight:700;letter-spacing:-.025em;color:var(--bright)}.pending{font-size:2.775vw;color:var(--muted);font-weight:400}.empty{grid-column:1/-1;text-align:center;padding:15vh 1vw;font-size:3.6vw;color:var(--muted)}footer{display:flex;justify-content:space-between;align-items:center;flex:none;font-size: 1.275vw;color:var(--muted);padding-top:1vh}#status{min-height:1em}#version{margin-left:auto}#viewport[aria-busy=true]{opacity:.9}

/* Fixed separators centered in the enlarged gutters. */
#labels{position:relative}#labels::before,#labels::after,#viewport::before,#viewport::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--gold);opacity:.85;pointer-events:none;z-index:2;transform:translateX(-50%)}#labels::before,#viewport::before{left:calc(33.333333% - .5vw)}#labels::after,#viewport::after{left:calc(66.666667% + .5vw)}

/* Main Ticket results retain their existing contrast. */
.main-row .winner:not(.pending){color:#fff}
#version{position:fixed;top:.55vh;right:.7vw;font-family:Helvetica,Arial,sans-serif;font-size:1.275vw;font-weight:300;color:var(--muted);opacity:.5;line-height:1;pointer-events:none;z-index:5;margin:0}

/* Other Games: identical-height entries with independent text fitting. */
#labels[hidden]{display:none}
.other-row{--number-track:max(7.2vh,calc(6.5vw + .25vh));--entry-height:calc(18.744444vh + var(--number-track));height:var(--entry-height);min-height:var(--entry-height);max-height:var(--entry-height);display:grid;grid-template-rows:var(--number-track) minmax(0,1fr) 2.7vh;gap:.65vh;padding:1.55vh 0 5.994444vh;border-bottom:1px solid var(--line);overflow:hidden}
.other-row + .other-row{margin-top:4.444444vh}
.other-numbers,.other-meta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.7vw;min-width:0;min-height:0;align-items:start}
.other-numbers{grid-template-columns:minmax(max-content,1fr) minmax(max-content,1fr);gap:.25vw;padding-right:.15vw}
.other-cell{min-width:0;display:flex;flex-direction:column;gap:.25vh}
.other-cell:last-child,.other-drawn{text-align:right}
.other-caption{display:block;color:var(--muted);font-size:1.15vw;line-height:1.1;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.other-big{display:block;font-size:3.5476875vw;line-height:1.12;font-weight:700;letter-spacing:normal;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.other-big.pending{font-size:1.7vw;color:var(--muted);font-weight:400;letter-spacing:-.035em}
.other-prize-wrap{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.other-prize{width:100%;font-size:1.85vw;line-height:1.12;font-weight:700;color:var(--bright);text-align:center;overflow-wrap:anywhere}
.other-meta{align-items:end;color:var(--muted);font-size:1.08vw;line-height:1.2;text-transform:uppercase;letter-spacing:.05em;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.other-type,.other-drawn{display:block;min-width:0;white-space:nowrap}
#adScreen{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center}#adScreen[hidden]{display:none}#adImage{width:100%;height:100%;object-fit:contain;display:block}#adImage[hidden],#adFallback[hidden]{display:none}#adFallback{text-align:center;padding:5vw;color:var(--gold)}#adFallback strong{display:block;font-size:4.5vw;line-height:1.2}#adFallback span{display:block;margin-top:3vh;color:var(--muted);font-size:2.2vw}
</style></head><body><header><span id="version">v1.17</span><h1 id="eventTitle">Live Bash Results</h1><p id="message">Claim all main ticket prizes at the front window.</p><h2 id="section">Main Ticket Results</h2></header><div id="labels"></div><main id="viewport"><div id="columns"></div></main><footer><span id="status" role="status">Connecting to event results…</span></footer><div id="adScreen"><img id="adImage" alt="Advertisement" hidden><div id="adFallback"><strong>Washington Township<br>Volunteer Fire Company</strong><span>Thank you for supporting Station 42</span></div></div>
<script>
'use strict';
const pullTabLabel=v=>String(v??'').replace(/\bstrip tickets?\b/gi,'Pull-Tabs');
const VERSION='1.17',ENDPOINT='https://script.google.com/macros/s/AKfycbyk2Pj807Lvuggb9SwbPwO_lRnuSKh8vd5GqXphr9iN4yVujtrINJYxU8n74VHTQ-TdlA/exec';
const TOP_HOLD=5000,BOTTOM_HOLD=10000,SCROLL_SPEED=22,REFRESH=10000;
const $=id=>document.getElementById(id), make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
let hasLoaded=false,current=null,mode='main',signature='',phase='top',phaseStart=0,offset=0,maxOffset=0,raf=0,failures=0,versionBusy=false;
const str=v=>String(v??'').trim();
function splitRows(rows){const q=Math.floor(rows.length/3),r=rows.length%3;const sizes=[q+(r>0?1:0),q+(r>1?1:0),q];let pos=0;return sizes.map(n=>{const chunk=rows.slice(pos,pos+n);pos+=n;return chunk})}
function normalize(p){if(!p||p.error||!Object.prototype.hasOwnProperty.call(p,'event'))throw Error('Invalid response');if(p.event===null)return null;const e=p.event;if(!e.meta||!Array.isArray(e.main)||!Array.isArray(e.other))throw Error('Invalid event');return {meta:e.meta,main:e.main.filter(Array.isArray).map(r=>({time:str(r[0]),number:str(r[1])})),other:e.other.filter(Array.isArray).map(r=>({time:str(r[0]),type:pullTabLabel(str(r[1])),serial:str(r[2]),number:str(r[3]),prize:str(r[4]),color:str(r[5]),name:str(r[6])}))}}
function drawRow(r){const n=make('div','main-row');n.append(make('span','time',r.time),make('span','winner'+(r.number?'':' pending'),r.number||'Pending'));return n}
function otherRow(r){
  const n=make('div','other-row'),top=make('div','other-numbers');
  const left=make('div','other-cell'),right=make('div','other-cell');
  if(r.type.toLowerCase()!=='raffle'||r.serial)left.append(make('span','other-caption','Serial #'),make('span','other-big',r.serial||'—'));
  right.append(make('span','other-caption','Winning #'),make('span','other-big'+(r.number?'':' pending'),r.number||'Pending'));
  top.append(left,right);
  const wrap=make('div','other-prize-wrap');
  const title=r.name&&r.prize&&r.name!==r.prize?r.name+' — '+r.prize:r.name||r.prize||'Result';
  wrap.append(make('div','other-prize',title));
  const meta=make('div','other-meta'),typeBits=[r.type,r.color?r.color+' ticket':''].filter(Boolean);
  meta.append(make('span','other-type',typeBits.join(' · ')),make('span','other-drawn',r.time?'Drawn at '+r.time:''));
  n.append(top,wrap,meta);return n;
}
function fitOtherText(){
  if(mode!=='other')return;
  const root=$('columns');
  for(const el of root.querySelectorAll('.other-caption,.other-big.pending,.other-type,.other-drawn,.other-prize')){
    el.style.fontSize='';const base=parseFloat(getComputedStyle(el).fontSize);if(!base||!el.clientWidth)continue;
    const isPrize=el.classList.contains('other-prize');
    const height=isPrize?el.parentElement.clientHeight:el.classList.contains('other-big')?el.closest('.other-numbers').clientHeight-(el.previousElementSibling?.offsetHeight||0)-window.innerHeight*.0025:el.closest('.other-meta')?.clientHeight||Infinity;
    el.style.whiteSpace=isPrize?'normal':'nowrap';
    let size=base;
    const fits=()=>el.scrollWidth<=el.clientWidth+1&&el.scrollHeight<=height+1&&(!isPrize||el.scrollHeight<=parseFloat(getComputedStyle(el).lineHeight)*2+1);
    while(!fits()&&size>1){size=Math.max(1,size*.94);el.style.fontSize=size+'px'}
  }
}
function measure(){maxOffset=Math.max(0,$('columns').scrollHeight-$('viewport').clientHeight);offset=Math.min(offset,maxOffset);$('columns').style.transform=`translateY(${-offset}px)`}
function render(reset=false){const e=current,m=e?.meta||{};const title=[(str(m['Event name'])||'')+' Live Results',str(m.Date)].filter(Boolean).join(' — ').trim();$('eventTitle').textContent=e?title:'Live Bash Results';$('message').textContent=mode==='main'?'Claim all main ticket prizes at the front window.':'';$('message').style.visibility=mode==='main'?'visible':'hidden';$('section').textContent=mode==='main'?'Main Ticket Results':'Other Game Results';const rows=e?e[mode]:[];const sig=JSON.stringify([mode,rows,!!e,hasLoaded]);if(sig!==signature){signature=sig;$('labels').hidden=mode==='other';const labels=mode==='main'?Array.from({length:3},()=>{const l=make('div','main-label');l.append(make('span','','Drawing Time'),make('span','','Winning Number'));return l}):[];$('labels').replaceChildren(...labels);$('columns').replaceChildren(...(rows.length?splitRows(rows).map(chunk=>{const c=make('div','column');c.append(...chunk.map(mode==='main'?drawRow:otherRow));return c}):[make('div','empty',!e?(hasLoaded?'No event currently available.':'Loading event results…'):mode==='main'?'No main ticket drawings available.':'No other game results yet.')]));fitOtherText();}if(reset){offset=0;phase='top';phaseStart=performance.now()}measure();}
function tick(now){if(mode==='ad'){if(!adLoading&&adDeadline!==null&&now>=adDeadline)advanceAd();raf=requestAnimationFrame(tick);return;}const elapsed=Math.max(0,now-phaseStart);if(phase==='top'&&elapsed>=TOP_HOLD){phase=maxOffset>0?'scroll':'bottom';phaseStart=now;offset=0;}else if(phase==='scroll'){offset=Math.min(maxOffset,elapsed*SCROLL_SPEED/1000*window.innerHeight/1080);if(offset>=maxOffset){phase='bottom';phaseStart=now;}}else if(phase==='bottom'&&elapsed>=BOTTOM_HOLD){if(mode==='main'){mode='other';render(true)}else completeResultsCycle();} $('columns').style.transform=`translateY(${-offset}px)`;raf=requestAnimationFrame(tick)}
async function fetchJSON(url){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const res=await fetch(url,{cache:'no-store',credentials:'omit',signal:controller.signal});if(!res.ok)throw Error('HTTP '+res.status);return await res.json()}finally{clearTimeout(timer)}}
async function refresh(){try{const url=new URL(ENDPOINT);url.searchParams.set('display','1');url.searchParams.set('hybrid','1');if(forceAds)url.searchParams.set('mode','ads');const payload=await fetchJSON(url);applyDisplayPayload(payload);failures=0;$('status').textContent='';}catch(e){failures++;$('status').textContent=current?'Connection interrupted — displaying last received results':'Waiting for display data — retrying';}finally{setTimeout(refresh,failures?Math.min(60000,10000*2**Math.min(failures-1,3))+Math.random()*2000:REFRESH)}}
async function checkVersion(){if(versionBusy)return;versionBusy=true;try{const v=await fetchJSON(new URL('version.json',location.href));if(/^\d+(\.\d+)+$/.test(v.version)&&v.version!==VERSION){const u=new URL(location.href);const last=Number(u.searchParams.get('_releaseTime'))||0;if(Date.now()-last>120000){u.searchParams.set('_releaseTime',Date.now());location.replace(u.href)}}}catch(e){}finally{versionBusy=false}}
window.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.repeat)return;e.preventDefault();manualAdvance()});
// Display policy and shared ad list. The explicit URL override always wins.
const adScreen=$('adScreen'),adImage=$('adImage'),adFallback=$('adFallback');
const forceAds=new URLSearchParams(location.search).get('mode')==='ads';
const ADS_ONLY='Advertising Only', RESULTS_ADS='Bash Results & Advertising', RESULTS_ONLY='Bash Results Only';
let policy=forceAds?ADS_ONLY:'pending';
let adFeed={seconds:15,ads:[]},adLastId='',adNextIndex=0,adToken=0,adDeadline=null,adLoading=false,adCurrentKey='';
const adCache=new Map(),adPending=new Map();
const AD_CACHE_MAX=24*1024*1024, AD_RETRY_MS=10000;
function resolveDisplayPolicy(feed){return forceAds?ADS_ONLY:[ADS_ONLY,RESULTS_ADS,RESULTS_ONLY].includes(feed?.displayMode)?feed.displayMode:RESULTS_ADS}
function adKey(ad){return ad.id+':'+ad.version}
function setAdFeed(feed){
  const list=Array.isArray(feed?.ads)?feed.ads.filter(a=>a&&/^[A-Za-z0-9_-]{10,100}$/.test(a.id)&&a.version):[];
  const seconds=Number(feed?.seconds), before=JSON.stringify(adFeed.ads.map(adKey));
  adFeed={seconds:Number.isFinite(seconds)&&seconds>=5&&seconds<=300?seconds:15,ads:list};
  const found=list.findIndex(a=>a.id===adLastId);
  if(found>=0)adNextIndex=(found+1)%list.length;
  else adNextIndex=list.length?Math.min(adNextIndex,list.length-1):0;
  for(const key of adCache.keys())if(!list.some(a=>adKey(a)===key))adCache.delete(key);
  return before!==JSON.stringify(list.map(adKey));
}
function cacheAd(key,src){
  adCache.delete(key);adCache.set(key,src);
  let bytes=[...adCache.values()].reduce((total,v)=>total+v.length,0);
  while(bytes>AD_CACHE_MAX&&adCache.size>1){
    const first=adCache.keys().next().value;bytes-=adCache.get(first).length;adCache.delete(first);
  }
}
function cachedAd(key){
  const src=adCache.get(key);if(src){adCache.delete(key);adCache.set(key,src);}return src;
}
function loadAd(ad){
  const key=adKey(ad),cached=cachedAd(key);
  if(cached)return Promise.resolve(cached);
  if(adPending.has(key))return adPending.get(key);
  const task=(async()=>{
    const url=new URL(ENDPOINT);url.searchParams.set('ad',ad.id);url.searchParams.set('version',ad.version);
    const p=await fetchJSON(url);
    if(!p||!['image/jpeg','image/png'].includes(p.mime)||typeof p.data!=='string'||!p.data||p.data.length>5600000)throw Error('Invalid advertisement');
    const src='data:'+p.mime+';base64,'+p.data;
    await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=reject;img.src=src});
    if(adFeed.ads.some(a=>adKey(a)===key))cacheAd(key,src);
    return src;
  })().finally(()=>adPending.delete(key));
  adPending.set(key,task);return task;
}
function preloadNextAd(){
  if(policy===RESULTS_ONLY||policy==='pending'||(policy===RESULTS_ADS&&!current))return;
  const a=adFeed.ads[adNextIndex];if(a)loadAd(a).catch(()=>{});
}
function showAdFallback(retry=true){
  adScreen.hidden=false;adImage.hidden=true;adImage.removeAttribute('src');adFallback.hidden=false;
  adCurrentKey='';adLoading=false;adDeadline=retry?performance.now()+AD_RETRY_MS:null;
  mode='ad';
}
function leaveAd(reset=true){
  adToken++;adLoading=false;adDeadline=null;adCurrentKey='';adScreen.hidden=true;adImage.hidden=true;adImage.removeAttribute('src');adFallback.hidden=true;
  mode='main';render(reset);preloadNextAd();
}
function advanceAd(){if(policy===ADS_ONLY)startAd();else leaveAd();}
function completeResultsCycle(){
  if(policy===RESULTS_ADS&&current&&adFeed.ads.length)startAd();
  else leaveAd();
}
async function startAd(){
  if(policy===RESULTS_ONLY||policy==='pending'||(policy===RESULTS_ADS&&!current)){leaveAd();return;}
  if(!adFeed.ads.length){
    adToken++;
    if(policy===ADS_ONLY)showAdFallback();else leaveAd();
    return;
  }
  const token=++adToken;
  mode='ad';adLoading=true;adDeadline=null;
  // Do not display results while in the all-day advertising mode.
  if(policy===ADS_ONLY&&(adScreen.hidden||!adFeed.ads.some(a=>adKey(a)===adCurrentKey))){
    showAdFallback(false);adLoading=true;
  }
  const list=adFeed.ads.slice(),start=adNextIndex%list.length;
  for(let i=0;i<list.length;i++){
    if(token!==adToken||mode!=='ad')return;
    const ad=list[(start+i)%list.length],key=adKey(ad);
    try{
      let src=cachedAd(key);
      if(!src&&i===0){
        let timeout;
        try{src=await Promise.race([loadAd(ad),new Promise((_,reject)=>{timeout=setTimeout(()=>reject(Error('Advertisement preload timeout')),4000)})]);}
        finally{clearTimeout(timeout);}
      }
      if(token!==adToken||mode!=='ad')return;
      if(!src||!adFeed.ads.some(a=>adKey(a)===key))continue;
      adLastId=ad.id;const index=adFeed.ads.findIndex(a=>a.id===ad.id);adNextIndex=(index+1)%adFeed.ads.length;
      adCurrentKey=key;adImage.src=src;adImage.hidden=false;adFallback.hidden=true;adScreen.hidden=false;
      adDeadline=performance.now()+adFeed.seconds*1000;adLoading=false;preloadNextAd();return;
    }catch(_){if(token!==adToken)return;}
  }
  if(token===adToken){
    // Skip a broken ad rather than getting stuck on it.
    adLastId=list[start].id;const i=adFeed.ads.findIndex(a=>a.id===adLastId);
    if(i>=0)adNextIndex=(i+1)%adFeed.ads.length;
    if(policy===ADS_ONLY){showAdFallback();preloadNextAd();}else leaveAd();
  }
}
function applyDisplayPayload(payload){
  const next=normalize(payload),previous=policy,changedEvent=(current?.meta?.['Event ID']||'')!==(next?.meta?.['Event ID']||'');
  current=next;hasLoaded=true;policy=resolveDisplayPolicy(payload.advertising);
  if(changedEvent&&previous!==ADS_ONLY&&policy!==ADS_ONLY){adLastId='';adNextIndex=0;}
  const listChanged=setAdFeed(payload.advertising);
  if(policy===ADS_ONLY){
    if(previous!==ADS_ONLY||mode!=='ad'||(listChanged&&(adLoading||!adFeed.ads.some(a=>adKey(a)===adCurrentKey))))startAd();
    else preloadNextAd();
    return;
  }
  if(previous!==policy||changedEvent||(mode==='ad'&&policy===RESULTS_ONLY)){leaveAd();return;}
  if(mode==='ad'){
    if(!adFeed.ads.length||(!adLoading&&!adFeed.ads.some(a=>adKey(a)===adCurrentKey)))leaveAd();
    return;
  }
  render();preloadNextAd();
}
function manualAdvance(){
  if(policy==='pending')return;
  if(policy===ADS_ONLY){if(!adLoading)startAd();return;}
  if(mode==='ad')leaveAd();
  else if(mode==='main'){mode='other';render(true);}
  else completeResultsCycle();
}

window.addEventListener('resize',()=>{if(mode!=='ad'){fitOtherText();measure()}});showAdFallback(false);raf=requestAnimationFrame(tick);refresh();setInterval(checkVersion,120000);
</script></body></html>
