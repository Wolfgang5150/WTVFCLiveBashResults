<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WTVFC Live Bash Results</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f7f4;color:#18372c;font:16px system-ui,sans-serif}header{background:#174c3b;color:white;text-align:center;padding:24px 12px}h1{margin:8px 0;font-size:2.5rem}small{letter-spacing:1px}main{max-width:850px;margin:auto;padding:16px}.notice{background:#fff1c8;padding:12px;border-radius:8px;color:#624a10;text-align:center;font-weight:bold}.hero{background:#174c3b;color:white;border-radius:12px;text-align:center;padding:22px;margin:16px 0}.hero strong{font-size:3rem;display:block}.hero p{margin:4px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,input{font:inherit;border:1px solid #a9c4b6;border-radius:8px;padding:12px}button{background:white;color:#174c3b;cursor:pointer}button.active{background:#174c3b;color:white}input{width:100%;background:white}article{background:white;border:1px solid #d9e5de;border-radius:9px;padding:12px 15px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:15px}article span{display:block;font-size:.85rem;color:#516a5e}article b{font-size:1.1rem}article strong{font-size:1.6rem;white-space:nowrap}h2{font-size:1.25rem}footer{text-align:center;padding:24px;color:#516a5e} @media(min-width:650px){#list{display:grid;grid-template-columns:1fr 1fr;gap:8px}article{margin:0}}

:root{--accent:#174c3b}header,.hero,button.active{background:var(--accent)}a{color:var(--accent)}#connection{font-size:.8rem;text-align:center;margin:8px} [hidden]{display:none!important}article strong{overflow-wrap:anywhere;white-space:normal}#archives a{display:block;padding:12px;background:white;border-radius:8px;margin:7px 0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #dd9b21} </style></head><body><header><small id="hosts">WASHINGTON TOWNSHIP VFC</small><h1 id="title">Live Bash Results</h1><div id="date"></div><div>WTVFC Live Bash Results</div></header><main><div id="notice" class="notice">Connecting to event results…</div><div id="connection" role="status"></div><a id="back" href="?" hidden>← Current event</a><section id="event" hidden><div class="hero"><small>LATEST MAIN TICKET WINNER</small><strong id="latest">—</strong><p id="latestPrize"></p></div><div id="next"></div><h2>Find your winning number</h2><input id="q" placeholder="Search number, game serial or prize" aria-label="Search results" type="search"><nav id="nav"></nav><h2 id="heading"></h2><div id="list"></div></section><h2>Previous events</h2><div id="archives"></div></main><footer id="footer">Washington Township Volunteer Fire Company<br>WTVFC Live Bash Results · v1.1</footer><script>
const endpoint='https://script.google.com/macros/s/AKfycbyk2Pj807Lvuggb9SwbPwO_lRnuSKh8vd5GqXphr9iN4yVujtrINJYxU8n74VHTQ-TdlA/exec';
const requested=new URLSearchParams(location.search).get('event');const $=id=>document.getElementById(id);const el=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};let data=null,mode='Main results',busy=false,lastGood=null;const modes=['Main results','Other games','Upcoming schedule','Full schedule'];
function render(){if(!data)return;const q=$('q').value.trim().toLowerCase();$('nav').replaceChildren(...modes.map(m=>{const b=el('button',m);b.className=m===mode?'active':'';b.setAttribute('aria-pressed',String(m===mode));b.onclick=()=>{mode=m;render()};return b}));$('heading').textContent=mode;let rows=mode==='Other games'?data.other.slice().reverse():mode==='Main results'?data.main.filter(r=>r.number).reverse():mode==='Upcoming schedule'?data.main.filter(r=>!r.number):data.main;rows=rows.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)));$('list').replaceChildren(...rows.map(r=>{let a=el('article',''),left=el('div','');left.append(el('span',r.time+(r.type?' · '+r.type:'')),el('b',r.prize||'Prize not listed'));if(r.serial)left.append(el('span','Serial # '+r.serial+(r.color?' · '+r.color+' ticket':'')));if(!r.type&&data.meta['Early bird rule']&&/^5:(10|20|30|40|50) PM$/.test(r.time)&&data.meta['Early birds begin']==='5:10 PM')left.append(el('span',data.meta['Early bird rule']));a.append(left,el('strong',r.number||'Pending'));return a}));if(!rows.length)$('list').append(el('p',q?'No matching results.':'No results in this section yet.'));}
function show(payload){if(!payload||payload.error||!Array.isArray(payload.archive)||!('event' in payload))throw Error('Invalid response');const e=payload.event;const links=payload.archive.map(x=>{const a=el('a',x.date+' — '+x.name);a.href='?event='+encodeURIComponent(x.id);return a});$('archives').replaceChildren(...(links.length?links:[el('p','No previous events currently published.')]));$('back').hidden=!requested;$('event').hidden=!e;if(!e){data=null;$('title').textContent='Live Bash Results';$('hosts').textContent='WASHINGTON TOWNSHIP VFC';$('date').textContent='';$('notice').textContent=requested?'This archived event is not available.':'No event currently running. Check previous events below.';return}if(!e.meta||!Array.isArray(e.main)||!Array.isArray(e.other))throw Error('Invalid event');data={meta:e.meta,main:e.main.map(r=>({time:r[0],number:r[1],prize:r[2]})),other:e.other.map(r=>({time:r[0],type:r[1],serial:r[2],number:r[3],prize:r[4],color:r[5]}))};const m=e.meta;document.documentElement.style.setProperty('--accent',/toy|christmas/i.test(m.Theme||'')?'#174c3b':'#81232a');$('hosts').textContent=m.Hosts||'Washington Township VFC';$('title').textContent=m['Event name']||'Live Bash Results';$('date').textContent=m.Date||'';$('notice').textContent=m.Status==='Demonstration'?'DEMONSTRATION — NOT OFFICIAL WINNING RESULTS':requested?'ARCHIVED EVENT':m.Status==='Completed'?'EVENT COMPLETED — FINAL RESULTS':m.Status==='Live'?'EVENT LIVE': 'UPCOMING EVENT';const last=data.main.filter(r=>r.number).at(-1),next=data.main.find(r=>!r.number);$('latest').textContent=last?last.number:'—';$('latestPrize').textContent=last?last.time+' · '+last.prize:'No winning numbers entered yet';$('next').textContent=next&&!requested&&m.Status!=='Completed'?'Next pending drawing: '+next.time+' — '+next.prize:'';render();}
async function refresh(){if(busy)return;busy=true;try{const url=new URL(endpoint);if(requested)url.searchParams.set('event',requested);const res=await fetch(url,{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(15000)});if(!res.ok)throw Error('HTTP '+res.status);const payload=await res.json();show(payload);lastGood=new Date();$('connection').textContent='Updated '+lastGood.toLocaleTimeString();}catch(e){$('connection').textContent=lastGood?'Connection interrupted — showing results from '+lastGood.toLocaleTimeString():'Unable to connect. Retrying automatically.';}finally{busy=false;}}$('q').oninput=render;refresh();setInterval(()=>{if(!document.hidden)refresh()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
